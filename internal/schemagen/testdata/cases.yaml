validation:
  - name: empty config
    input: '{}'
    valid: true
  - name: partial config
    input: '{"spec":{"api":{"port":6443}}}'
    valid: true
  - name: null sections
    input: '{"spec":{"api":null,"network":{},"storage":null}}'
    valid: false
  - name: null spec
    input: '{"spec":null}'
    valid: false
  - name: partial image override
    input: '{"spec":{"images":{"coredns":{"version":"custom"}}}}'
    valid: false
  - name: metadata
    input: '{"apiVersion":"k0s.k0sproject.io/v1beta1","kind":"ClusterConfig","metadata":{"name":"k0s","labels":{"example.com/team":"ops"}}}'
    valid: true
  - name: extra arguments
    input: '{"spec":{"api":{"extraArgs":{"audit-log-path":"/tmp/audit.log"}}}}'
    valid: true
  - name: worker values
    input: '{"spec":{"workerProfiles":[{"name":"custom","values":{"featureGates":{"Example":true},"reservedMemory":[{"numaNode":0,"limits":{"memory":"1Gi"}}],"clusterDNS":["10.96.0.10"],"arbitrary":null}}]}}'
    valid: true
  - name: helm duration
    input: '{"spec":{"extensions":{"helm":{"charts":[{"chartname":"example/app","name":"app","namespace":"default","timeout":"5m","values":"replicas: 2"}]}}}}'
    valid: true
  - name: legacy helm duration
    input: '{"spec":{"extensions":{"helm":{"charts":[{"chartname":"example/app","name":"app","namespace":"default","timeout":60000000000}]}}}}'
    valid: true
  - name: wrong helm duration type
    input: '{"spec":{"extensions":{"helm":{"charts":[{"chartname":"example/app","name":"app","namespace":"default","timeout":true}]}}}}'
    valid: false
  - name: unknown section
    input: '{"spec":{"networks":{}}}'
    valid: false
  - name: unknown field
    input: '{"spec":{"api":{"prot":6443}}}'
    valid: false
  - name: wrong port type
    input: '{"spec":{"api":{"port":"6443"}}}'
    valid: false
  - name: wrong boolean type
    input: '{"spec":{"telemetry":{"enabled":"true"}}}'
    valid: false
  - name: wrong map value type
    input: '{"spec":{"api":{"extraArgs":{"flag":[]}}}}'
    valid: false
  - name: wrong list item type
    input: '{"spec":{"api":{"sans":[42]}}}'
    valid: false
  - name: wrong worker values type
    input: '{"spec":{"workerProfiles":[{"name":"custom","values":"text"}]}}'
    valid: false
  - name: unknown worker field
    input: '{"spec":{"workerProfiles":[{"name":"custom","vaues":{}}]}}'
    valid: false
  - name: wrong root type
    input: '[]'
    valid: false
  - name: image override
    input: '{"spec":{"images":{"coredns":{"image":"example.com/coredns","version":"v1.0"}}}}'
    valid: true
  - name: image digest
    input: '{"spec":{"images":{"coredns":{"image":"example.com/coredns","version":"v1@sha256:0123456789abcdefABCDEF0123456789abcdefABCDEF0123456789abcdefABCDEF01"}}}}'
    valid: true
  - name: invalid image version
    input: '{"spec":{"images":{"coredns":{"image":"example.com/coredns","version":"bad tag"}}}}'
    valid: false
  - name: invalid image digest
    input: '{"spec":{"images":{"coredns":{"image":"example.com/coredns","version":"v1@sha256:zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"}}}}'
    valid: false
  - name: zero API port
    input: '{"spec":{"api":{"port":0}}}'
    valid: false
  - name: empty pull policy
    input: '{"spec":{"images":{"default_pull_policy":""}}}'
    valid: false
  - name: feature without enabled
    input: '{"spec":{"featureGates":[{"name":"ExampleFeature"}]}}'
    valid: false
  - name: feature with enabled
    input: '{"spec":{"featureGates":[{"name":"ExampleFeature","enabled":false}]}}'
    valid: true
  - name: negative API port
    input: '{"spec":{"api":{"port":-1}}}'
    valid: false
  - name: oversized API port
    input: '{"spec":{"api":{"k0sApiPort":65536}}}'
    valid: false
  - name: zero konnectivity port
    input: '{"spec":{"konnectivity":{"agentPort":0}}}'
    valid: false
  - name: invalid pull policy
    input: '{"spec":{"images":{"default_pull_policy":"Alwayz"}}}'
    valid: false
  - name: invalid Calico mode
    input: '{"spec":{"network":{"calico":{"mode":"invalid"}}}}'
    valid: false
  - name: invalid storage type
    input: '{"spec":{"storage":{"type":"invalid"}}}'
    valid: false
  - name: empty chart
    input: '{"spec":{"extensions":{"helm":{"charts":[{}]}}}}'
    valid: false
  - name: null chart
    input: '{"spec":{"extensions":{"helm":{"charts":[null]}}}}'
    valid: false
  - name: empty repository
    input: '{"spec":{"extensions":{"helm":{"repositories":[{}]}}}}'
    valid: false
  - name: empty repository name
    input: '{"spec":{"extensions":{"helm":{"repositories":[{"name":"","url":"https://example.com"}]}}}}'
    valid: false
  - name: null repository name
    input: '{"spec":{"extensions":{"helm":{"repositories":[{"name":null,"url":"https://example.com"}]}}}}'
    valid: false
  - name: empty patch
    input: '{"spec":{"metricsServer":{"patches":[{}]}}}'
    valid: false
  - name: null patch target
    input: '{"spec":{"metricsServer":{"patches":[{"target":null,"patch":{"type":"MergePatch","content":"{}"}}]}}}'
    valid: false
  - name: invalid patch type
    input: '{"spec":{"metricsServer":{"patches":[{"target":{"kind":"Deployment","name":"metrics-server"},"patch":{"type":"invalid","content":"{}"}}]}}}'
    valid: false
  - name: missing feature name
    input: '{"spec":{"featureGates":[{"enabled":false}]}}'
    valid: false
  - name: empty feature name
    input: '{"spec":{"featureGates":[{"name":"","enabled":false}]}}'
    valid: false
  - name: missing worker name
    input: '{"spec":{"workerProfiles":[{"values":{}}]}}'
    valid: false
  - name: missing etcd endpoints
    input: '{"spec":{"storage":{"etcd":{"externalCluster":{}}}}}'
    valid: false
  - name: empty etcd endpoints
    input: '{"spec":{"storage":{"etcd":{"externalCluster":{"endpoints":[]}}}}}'
    valid: false
  - name: oversized VRRP ID
    input: '{"spec":{"network":{"controlPlaneLoadBalancing":{"keepalived":{"vrrpInstances":[{"authPass":"secret","virtualIPs":["192.0.2.1/24"],"virtualRouterID":256}]}}}}}'
    valid: false
  - name: long VRRP password
    input: '{"spec":{"network":{"controlPlaneLoadBalancing":{"keepalived":{"vrrpInstances":[{"authPass":"too-long-password","virtualIPs":["192.0.2.1/24"]}]}}}}}'
    valid: false
  - name: zero proxy konnectivity port
    input: '{"spec":{"network":{"nodeLocalLoadBalancing":{"envoyProxy":{"konnectivityServerBindPort":0}}}}}'
    valid: false
structural:
  - name: root metadata is open
    schema: '{"type":"object","properties":{"metadata":{"type":"object","properties":{"known":{"type":"string"}}}}}'
    root: true
    valid:
      - '{"metadata":{"unknown":true}}'
    invalid:
      - '{"metadata":{"known":false}}'
  - name: nested metadata is closed
    schema: '{"type":"object","properties":{"spec":{"type":"object","properties":{"metadata":{"type":"object","properties":{"known":{"type":"string"}}}}}}}'
    valid:
      - '{"spec":{"metadata":{"known":"value"}}}'
    invalid:
      - '{"spec":{"metadata":{"unknown":true}}}'
  - name: optional is not nullable
    schema: '{"type":"object","properties":{"value":{"type":"string"}}}'
    valid:
      - '{}'
      - '{"value":"ok"}'
    invalid:
      - '{"value":null}'
      - '{"other":1}'
  - name: integer or string
    schema: '{"x-kubernetes-int-or-string":true}'
    valid:
      - '42'
      - '"42"'
    invalid:
      - 'true'
      - '1.5'
      - 'null'
  - name: int32 bounds
    schema: '{"type":"integer","format":"int32"}'
    valid:
      - '-2147483648'
      - '2147483647'
    invalid:
      - '-2147483649'
      - '2147483648'
  - name: tighter int32 bounds
    schema: '{"type":"integer","format":"int32","minimum":1,"maximum":65535}'
    valid:
      - '1'
      - '65535'
    invalid:
      - '0'
      - '65536'
  - name: minimum array items
    schema: '{"type":"array","items":{"type":"string"},"minItems":1}'
    valid:
      - '["value"]'
    invalid:
      - '[]'
  - name: wider int32 bounds
    schema: '{"type":"integer","format":"int32","minimum":-3000000000,"maximum":3000000000}'
    valid:
      - '-2147483648'
      - '2147483647'
    invalid:
      - '-2147483649'
      - '2147483648'
  - name: preserved unknown fields
    schema: '{"type":"object","x-kubernetes-preserve-unknown-fields":true,"properties":{"known":{"type":"integer"}}}'
    valid:
      - '{"known":1,"arbitrary":{"nested":[null,true]}}'
    invalid:
      - '{"known":"bad"}'
  - name: explicit additional properties
    schema: '{"type":"object","properties":{"known":{"type":"integer"}},"additionalProperties":true}'
    valid:
      - '{"other":true}'
    invalid:
      - '{"known":false}'
  - name: explicitly closed object
    schema: '{"type":"object","properties":{"known":{"type":"integer"}},"additionalProperties":false}'
    valid:
      - '{"known":1}'
    invalid:
      - '{"other":true}'
  - name: nested arrays and maps
    schema: '{"type":"object","additionalProperties":{"type":"array","items":{"type":"object","properties":{"value":{"type":"string","x-kubernetes-int-or-string":true}}}}}'
    valid:
      - '{"key":[{"value":1}]}'
      - '{"key":[{"value":"text"}]}'
    invalid:
      - '{"key":[{"value":true}]}'
      - '{"key":[{"other":1}]}'
  - name: additional property schema
    schema: '{"type":"object","additionalProperties":{"type":"string"}}'
    valid:
      - '{"key":"value"}'
    invalid:
      - '{"key":false}'
  - name: CEL contains
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.contains(''a.b'')"}]}'
    valid:
      - '"xa.by"'
    invalid:
      - '"xaXby"'
      - '"ab"'
  - name: CEL starts with
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.startsWith(''a.'')"}]}'
    valid:
      - '"a.b"'
    invalid:
      - '"aXb"'
      - '"ba."'
  - name: CEL ends with
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.endsWith(''.a'')"}]}'
    valid:
      - '"b.a"'
    invalid:
      - '"bXa"'
      - '".ab"'
  - name: CEL matches
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.matches(''^[a-z]+$'')"}]}'
    valid:
      - '"abc"'
    invalid:
      - '"abc1"'
  - name: CEL negation
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!self.contains(''a'')"}]}'
    valid:
      - '"b"'
    invalid:
      - '"bab"'
  - name: CEL conjunction
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.startsWith(''a'') && !self.contains(''b'') && !self.endsWith(''c'')"}]}'
    expected: '{"type":"string","allOf":[{"pattern":"^a"},{"not":{"pattern":"b"}},{"not":{"pattern":"c$"}}]}'
    valid:
      - '"acd"'
    invalid:
      - '"cd"'
      - '"abd"'
      - '"adc"'
  - name: CEL disjunction
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.startsWith(''a'') || !self.contains(''b'') || !self.endsWith(''c'')"}]}'
    valid:
      - '"a"'
      - '"b"'
      - '"c"'
      - '"cb"'
      - '"axx"'
      - '"abc"'
      - '"d"'
    invalid:
      - '"bc"'
  - name: CEL disjunction within a conjunction
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.startsWith(''a'') && (self.endsWith(''b'') || self.endsWith(''c''))"}]}'
    expected: '{"type":"string","allOf":[{"pattern":"^a"},{"anyOf":[{"pattern":"b$"},{"pattern":"c$"}]}]}'
    valid:
      - '"ab"'
      - '"ac"'
    invalid:
      - '"ad"'
      - '"db"'
      - '"dc"'
  - name: CEL negated conjunction
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!(self.startsWith(''a'') && self.endsWith(''c''))"}]}'
    valid:
      - '"ab"'
      - '"bc"'
      - '"b"'
    invalid:
      - '"abc"'
      - '"ac"'
  - name: CEL negated disjunction
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!(self.startsWith(''a'') || self.endsWith(''c''))"}]}'
    valid:
      - '"b"'
    invalid:
      - '"ab"'
      - '"bc"'
      - '"ac"'
  - name: multiple CEL rules
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.startsWith(''a'')"},{"rule":"!self.endsWith(''c'')"}]}'
    expected: '{"type":"string","pattern":"^a","not":{"pattern":"c$"}}'
    valid:
      - '"acd"'
    invalid:
      - '"cd"'
      - '"adc"'
  - name: several negated CEL rules
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!self.contains(''a'')"},{"rule":"!self.contains(''b'')"},{"rule":"!self.contains(''c'')"}]}'
    expected: '{"type":"string","not":{"pattern":"a"},"allOf":[{"not":{"pattern":"b"}},{"not":{"pattern":"c"}}]}'
    valid:
      - '"d"'
    invalid:
      - '"da"'
      - '"db"'
      - '"dc"'
  - name: CEL conjunctions in several rules
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!self.contains(''a'') && !self.contains(''b'')"},{"rule":"!self.endsWith(''c'')"},{"rule":"!self.contains(''d'') && !self.contains(''e'')"}]}'
    expected: '{"type":"string","not":{"pattern":"c$"},"allOf":[{"not":{"pattern":"a"}},{"not":{"pattern":"b"}},{"not":{"pattern":"d"}},{"not":{"pattern":"e"}}]}'
    valid:
      - '"cf"'
    invalid:
      - '"fa"'
      - '"fb"'
      - '"fc"'
      - '"fd"'
      - '"fe"'
  - name: single positive CEL rule next to a pattern
    schema: '{"type":"string","description":"made up","pattern":"^[a-z]+$","x-kubernetes-validations":[{"rule":"self.startsWith(''a'')"}]}'
    expected: '{"type":"string","description":"made up","pattern":"^[a-z]+$","allOf":[{"pattern":"^a"}]}'
    valid:
      - '"ab"'
    invalid:
      - '"a1"'
      - '"b"'
  - name: several positive CEL rules next to a pattern
    schema: '{"type":"string","pattern":"^[a-z]+$","x-kubernetes-validations":[{"rule":"self.startsWith(''a'')"},{"rule":"self.endsWith(''c'')"}]}'
    expected: '{"type":"string","pattern":"^[a-z]+$","allOf":[{"pattern":"^a"},{"pattern":"c$"}]}'
    valid:
      - '"abc"'
    invalid:
      - '"a1c"'
      - '"bc"'
      - '"ab"'
  - name: CEL rule equal to the pattern
    schema: '{"type":"string","pattern":"^a","x-kubernetes-validations":[{"rule":"self.startsWith(''a'')"}]}'
    expected: '{"type":"string","pattern":"^a"}'
    valid:
      - '"ab"'
    invalid:
      - '"b"'
  - name: CEL conjunction next to a pattern
    schema: '{"type":"string","pattern":"^[a-z]+$","x-kubernetes-validations":[{"rule":"self.startsWith(''a'') && !self.endsWith(''c'')"}]}'
    expected: '{"type":"string","pattern":"^[a-z]+$","allOf":[{"pattern":"^a"},{"not":{"pattern":"c$"}}]}'
    valid:
      - '"ab"'
    invalid:
      - '"a1"'
      - '"b"'
      - '"ac"'
  - name: CEL string escapes
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!self.contains(''\"'') && !self.contains(''\\n'') && !self.contains(''\\x00'') && !self.endsWith(''\\\\'')"}]}'
    valid:
      - '"a\\b"'
    invalid:
      - '"a\"b"'
      - '"a\nb"'
      - '"a\u0000b"'
      - '"ab\\"'
unsupported:
  - name: nullable
    schema: '{"type":"string","nullable":true}'
    error: 'unsupported schema keyword "nullable"'
  - name: exclusive minimum
    schema: '{"type":"number","exclusiveMinimum":true}'
    error: 'unsupported schema keyword "exclusiveMinimum"'
  - name: all of
    schema: '{"allOf":[{"type":"string"}]}'
    error: 'unsupported schema keyword "allOf"'
  - name: CEL rule on a non-string
    schema: '{"type":"integer","x-kubernetes-validations":[{"rule":"self > 0"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      unsupported operation:
      schema type integer
  - name: CEL function without a translation
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.size() < 5"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "self.size() < 5":
      unsupported operation:
      function call "_<_"
  - name: CEL string function without a translation
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.foo(''a'')"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "self.foo('a')":
      unsupported operation:
      function call "self.foo"
  - name: CEL expression that is not a function call
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "self":
      unsupported operation:
      not a function call
  - name: CEL argument that is not a literal
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.contains(self)"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "self.contains(self)":
      unsupported operation:
      function call "self.contains" is not receiving a single literal string
  - name: CEL argument that is not a string
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.contains(1)"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "self.contains(1)":
      unsupported operation:
      function call "self.contains" is not receiving a single literal string
  - name: CEL receiver other than self
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"''abc''.contains(self)"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "'abc'.contains(self)":
      unsupported operation:
      function call "contains" is not targeting self
  - name: CEL transition rule
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"oldSelf.startsWith(''a'')"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "oldSelf.startsWith('a')":
      unsupported operation:
      function call "oldSelf.startsWith" is not targeting self
  - name: CEL conjunction with an operand without a translation
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"self.contains(''a'') && self.size() < 5"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "self.contains('a') && self.size() < 5":
      unsupported operation:
      function call "_<_"
  - name: CEL negation of an operand without a translation
    schema: '{"type":"string","x-kubernetes-validations":[{"rule":"!self.foo(''a'')"}]}'
    error: >-
      x-kubernetes-validations:
      failed to produce JSON Schemas for CEL validation rules:
      rule "!self.foo('a')":
      unsupported operation:
      function call "self.foo"
  - name: int32 string format
    schema: '{"type":"string","format":"int32"}'
    error: 'unsupported format int32 for type string'
  - name: nullable property
    schema: '{"properties":{"value":{"nullable":true}}}'
    error: 'property "value": unsupported schema keyword "nullable"'
  - name: nullable item
    schema: '{"items":{"nullable":true}}'
    error: 'items: unsupported schema keyword "nullable"'
  - name: nullable additional property
    schema: '{"additionalProperties":{"nullable":true}}'
    error: 'additionalProperties: unsupported schema keyword "nullable"'
