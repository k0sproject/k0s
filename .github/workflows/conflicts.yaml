name: Check for merge conflicts

# This workflow runs with elevated trust on pull requests from forks. It must
# never check out or execute pull request code. The action only reads pull
# request metadata and updates labels and comments.

on:
  push:
    branches:
      - main
      - release-*
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - release-*

permissions:
  contents: read
  pull-requests: write

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for merge conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: merge-conflict
          commentOnDirty: This pull request has merge conflicts that need to be resolved.
