name: Upgrade agentic workflows

# The *.lock.yml files pin the gh-aw runtime of the compiler that generated
# them, so Dependabot leaves them alone. Instead, recompile them with the
# latest gh-aw and open a pull request if anything changed.
on:
  workflow_dispatch:
  schedule:
    - cron: 41 5 * * 1 # Mondays at 05:41 UTC.

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade agentic workflows
    runs-on: ubuntu-24.04
    # The token below only exists upstream.
    if: github.repository == 'k0sproject/k0s'

    steps:
      # Pushing changes to workflow files needs the workflow scope, which the
      # stock GitHub Actions token never has.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_BACKPORT_TOKEN }}
          show-progress: false

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install githubnext/gh-aw

      - name: Recompile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw upgrade --no-agent --no-mcp --no-skill

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GH_BACKPORT_TOKEN }}
          BRANCH: bot/gh-aw-upgrade
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version=$(gh aw version | awk '{print $NF}')
          title="Recompile agentic workflows with gh-aw $version"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -s -m "$title"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" \
              --body "Generated by \`gh aw upgrade\`. Review the changes to the .md files, if any: those are codemods."
          fi
          echo "$title" >> "$GITHUB_STEP_SUMMARY"
